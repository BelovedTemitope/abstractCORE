name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Validate example projects
        run: |
          for f in examples/*.acore.json; do node dist/cli.js validate "$f"; done
      - name: Demo bundle is up to date
        run: |
          npm run demo
          git diff --exit-code demo/app.js
