<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea tree: describe it, from broad to specific</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface-2:#F5F7F4; --ink:#1F2A24; --ink-2:#5C6961; --line:#D3DBD2;
  --accent:#2F5D50; --accent-soft:#E1ECE7; --on-accent:#FFFFFF;
  --must:#C33129; --must-bg:#FBEAE8; --sug:#4B55C4; --sug-bg:#ECEDFB; --ok:#2B7A52;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A17; --surface:#1E2622; --surface-2:#19201C; --ink:#E5ECE7; --ink-2:#9DAAA2; --line:#2F3A34;
    --accent:#86C9B2; --accent-soft:#233630; --on-accent:#10201A;
    --must:#FF6F66; --must-bg:#3A1E1C; --sug:#A3AAF7; --sug-bg:#262a4a; --ok:#6FD19E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1E2622; --surface-2:#19201C; --ink:#E5ECE7; --ink-2:#9DAAA2; --line:#2F3A34;
  --accent:#86C9B2; --accent-soft:#233630; --on-accent:#10201A;
  --must:#FF6F66; --must-bg:#3A1E1C; --sug:#A3AAF7; --sug-bg:#262a4a; --ok:#6FD19E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15.5px;line-height:1.5}
button,textarea{font:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 18px;display:grid;gap:10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:-.015em}
.brand small{font-weight:500;color:var(--ink-2);font-size:14px;margin-left:10px;letter-spacing:0}
.prog{display:flex;align-items:center;gap:12px}
.prog .txt{font-size:14px;color:var(--ink-2);white-space:nowrap}
.prog .txt b{color:var(--ink)}
.bar{width:140px;height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 11px;cursor:pointer;font-size:14px}
.tabs{display:flex;gap:4px}
.tabs button{white-space:nowrap;border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.tabs .count{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--ink-2)}
.tabs .count.red{background:var(--must);border-color:var(--must);color:#fff}
.tabs [data-v="tree"]{display:none}

/* Main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 450px;min-height:0}
#tree,#guide,#needs{grid-row:1;min-height:0;overflow:auto}
#tree{grid-column:1;padding:20px 24px 40px}
#guide,#needs{grid-column:2;background:var(--surface);border-left:1px solid var(--line)}
.main:not([data-view="needs"]) #needs{display:none}
.main[data-view="needs"] #guide{display:none}

/* Tree */
.scale{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;margin:0 0 6px;max-width:520px}
.scale::after{content:"";order:2;flex:1;height:2px;background:linear-gradient(90deg,var(--accent),var(--line))}
.scale span:last-child{order:3}
.tnode{position:relative}
.children{margin-left:20px;padding-left:24px;border-left:2px solid var(--line)}
.children>.tnode::before{content:"";position:absolute;left:-24px;top:40px;width:20px;border-top:2px solid var(--line)}
.children>.tnode:last-child::after{content:"";position:absolute;left:-26px;top:42px;bottom:0;width:6px;background:var(--bg)}
.card{position:relative;display:block;width:100%;max-width:440px;margin:10px 0;text-align:left;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px 12px 20px}
.card::before{content:"";position:absolute;left:-7px;top:26px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.depth0>.card::before{display:none}
.card:hover{border-color:var(--ink-2)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card.has-must{border-left:5px solid var(--must);padding-left:17px}
.card .lv{font-size:12.5px;color:var(--ink-2);font-weight:600}
.card .ti{display:block;font-size:17.5px;font-weight:700;line-height:1.25;margin-top:1px;letter-spacing:-.01em}
.card .su{display:block;color:var(--ink-2);font-size:14px;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:12.5px;font-weight:600;border-radius:20px;padding:1px 9px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.pill.red{background:var(--must-bg);border-color:var(--must);color:var(--must)}
.pill.sug{background:var(--sug-bg);border-color:transparent;color:var(--sug)}
.pill.done{background:transparent;border-color:transparent;color:var(--ok);padding-left:0}
.appear{animation:appear .35s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.appear{animation:none}}

/* Guide */
.gin{padding:18px 20px 90px}
.gin>.lv{font-size:13px;color:var(--ink-2);font-weight:600}
.gin h2{font-size:24px;line-height:1.2;margin:2px 0 4px;letter-spacing:-.015em}
.gin>.su{color:var(--ink-2);margin:0 0 14px}
.intro{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:14.5px}
.intro p{margin:0}
.intro p+p{margin-top:6px}
.key{display:grid;gap:5px;margin-top:10px;font-size:13.5px}
.key div{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center}
.key div>*:first-child{justify-self:start}
.q,.sg{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px;background:var(--surface)}
.q.must{border-color:color-mix(in srgb,var(--must) 55%,var(--line));box-shadow:inset 5px 0 0 var(--must);padding-left:20px}
.q.must.done{border-color:var(--line);box-shadow:inset 5px 0 0 var(--ok)}
.q.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--surface)}}
@media (prefers-reduced-motion: reduce){.q.flash{animation:none}}
.qlabel{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12.5px;font-weight:700}
.must-pill{white-space:nowrap;color:#fff;background:var(--must);border-radius:20px;padding:1px 9px}
.ask-pill{color:var(--ink-2)}
.sg-pill{color:var(--sug)}
.ok{color:var(--ok);font-weight:700;font-size:12.5px}
.opt-note{color:var(--ink-2);font-weight:500}
.q h3,.sg h3{font-size:17px;line-height:1.3;margin:0 0 6px}
.qhint{margin:0 0 10px;color:var(--ink-2);font-size:14px}
.why{margin:0 0 10px;font-size:14px;color:var(--ink-2)}
.why b{color:var(--must);font-weight:600}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 11px;cursor:pointer}
.opt:hover{border-color:var(--ink-2)}
.opt small{display:block;color:var(--ink-2);font-size:13px;line-height:1.35}
.opt b{font-weight:600}
.mark{flex:none;width:18px;height:18px;margin-top:2px;border:2px solid var(--ink-2);border-radius:50%;display:grid;place-items:center}
.opt.multi .mark{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .mark{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .mark::after{content:"";width:6px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.needs{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line);font-size:14px}
.needs b{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:2px}
.needs ul{margin:0;padding-left:18px}
.skipnote{margin:10px 0 0;font-size:13.5px;color:var(--ink-2)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;font-size:inherit}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface-2);resize:vertical;min-height:76px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.ainote{margin:10px 0 0;font-size:14px;padding:9px 12px;border-radius:10px;background:var(--accent-soft)}
.sg{border-style:dashed;border-color:color-mix(in srgb,var(--sug) 55%,var(--line));background:color-mix(in srgb,var(--sug-bg) 45%,var(--surface))}
.sg.acc{border-style:solid;border-color:var(--line);background:var(--surface)}
.sgbtns{display:flex;gap:8px}
.sec{font-size:14px;color:var(--ink-2);font-weight:700;margin:22px 0 10px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.parts button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:600}
.parts button:hover{border-color:var(--ink-2)}
.nextbar{position:sticky;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--surface) 30%)}
.next{width:100%;border:0;border-radius:12px;padding:12px 16px;background:var(--ink);color:var(--surface);font-weight:700;font-size:15.5px;cursor:pointer}

/* Needs */
.nin{padding:18px 20px 40px}
.nin h2{font-size:24px;margin:0 0 4px;letter-spacing:-.015em}
.nin>p{color:var(--ink-2);margin:0 0 14px}
.status{border-radius:12px;padding:12px 14px;margin-bottom:6px}
.status.red{background:var(--must-bg);border:1.5px solid var(--must)}
.status.red strong{color:var(--must)}
.status.ok{background:var(--accent-soft);border:1.5px solid var(--ok)}
.status p{margin:4px 0 0;font-size:14.5px}
.status a{color:var(--accent);font-weight:700}
.jl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.jl button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:14px}
.jl button small{display:block;color:var(--ink-2);font-size:12.5px}
.group{margin-bottom:12px}
.group h4{margin:0 0 4px;font-size:14.5px}
.group ul{margin:0;padding-left:20px;font-size:14.5px}
.group li{margin:2px 0}
.dl{display:grid;gap:8px;font-size:14.5px}
.dl div{border-bottom:1px solid var(--line);padding-bottom:7px}
.dl span{display:block;color:var(--ink-2);font-size:13px}
.empty{color:var(--ink-2);font-size:14.5px;margin:0}

@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr)}
  #tree,#guide,#needs{grid-column:1;border-left:0}
  .main:not([data-view="tree"]) #tree{display:none}
  .main[data-view="tree"] #guide{display:none}
  .tabs [data-v="tree"]{display:inline-flex}
  #tree{padding:14px 14px 40px}
  .children{margin-left:12px;padding-left:18px}
  .children>.tnode::before{left:-18px;width:14px}
  .children>.tnode:last-child::after{left:-20px}
  .brand small,.bar{display:none}
  .top{padding:8px 12px}
  .tabs button{padding:6px 9px}
  .gin,.nin{padding-left:16px;padding-right:16px}
  .nextbar{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="row1">
      <div class="brand">Idea tree<small>Sample: an online clothing store</small></div>
      <div class="prog">
        <span class="txt" id="progTxt"></span>
        <span class="bar" aria-hidden="true"><i id="progBar"></i></span>
        <button class="reset" data-act="reset">Start over</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Views">
      <button data-act="view" data-v="tree">Tree</button>
      <button data-act="view" data-v="guide">Questions <span class="count red" id="cMust"></span></button>
      <button data-act="view" data-v="needs">What it needs <span class="count" id="cNeeds"></span></button>
    </nav>
  </header>
  <div class="main" id="main" data-view="guide">
    <section id="tree" aria-label="Your idea tree"></section>
    <section id="guide" aria-label="Questions"></section>
    <section id="needs" aria-label="What it needs"></section>
  </div>
</div>

<script>
const LV = ["The idea", "Where it lives", "What it does", "The details"];
const SITE_T = {web:"A website", app:"A phone app", both:"A website and a phone app"};
const TECH_URL = "https://claude.ai/artifact/KEXQioh9T5qBn69S52xQbN";

const DEF = {
  idea:{level:0, title:"An online clothing store", sub:"Sell my own clothing designs online.", questions:[
    {id:"platform", kind:"must", type:"single", text:"Where will your customers use it?",
     why:"This shapes almost everything after it, including cost and time. The AI should not pick this for you.",
     options:[
      {v:"web", label:"A website", note:"Opens in any browser, on phones and computers.", needs:["A web address (domain name), renewed yearly","Web hosting to keep the site online"], spawn:["site"]},
      {v:"app", label:"A phone app", note:"Installed from the App Store or Google Play.", needs:["Apple and Google developer accounts (yearly fees)","App store review before each release"], spawn:["site"]},
      {v:"both", label:"Both", note:"Reaches the most people, costs the most.", needs:["A web address (domain name), renewed yearly","Web hosting to keep the site online","Apple and Google developer accounts (yearly fees)","Two things to build and keep updated"], spawn:["site"]}]}
  ]},
  site:{level:1, title:null, sub:"Where your store lives", questions:[
    {id:"buyers", kind:"ask", type:"single", text:"Who will be buying?", default:"Everyday shoppers buying one or two items.", options:[
      {v:"retail", label:"Everyday shoppers"},
      {v:"bulk", label:"Shops buying in bulk", needs:["Bulk price lists and minimum order sizes"]},
      {v:"both", label:"Both", needs:["Two price lists: regular and bulk","A way to mark some customers as bulk buyers"]}]},
    {id:"features", kind:"ask", type:"multi", text:"What should people be able to do?", hint:"Pick everything you want. Each one becomes its own part of your plan.", default:"Nothing gets planned until you pick at least one.", options:[
      {v:"browse", label:"Browse my clothes", spawn:["browse"]},
      {v:"buy", label:"Buy and pay", spawn:["buy"]},
      {v:"account", label:"Have an account", spawn:["account"]},
      {v:"track", label:"Track their order", spawn:["track"]},
      {v:"fav", label:"Save favourites", spawn:["fav"]},
      {v:"reviews", label:"Leave reviews", spawn:["reviews"]}]}
  ], suggestions:[
    {id:"admin", text:"A place for you to add clothes and see orders", why:"Almost every store needs this. The AI flags it because it was not on your list.", spawn:["admin"]}]},

  browse:{level:2, title:"Browse my clothes", sub:"How people look through what you sell", questions:[
    {id:"find", kind:"ask", type:"multi", text:"How should people find things?", default:"One list of everything, newest first.", options:[
      {v:"cat", label:"By category", note:"Dresses, shirts, trousers and so on.", needs:["Your list of categories"]},
      {v:"search", label:"A search bar"},
      {v:"size", label:"Filter by size"},
      {v:"colour", label:"Filter by colour", needs:["Each item tagged with its colours"]},
      {v:"price", label:"Filter by price"}]},
    {id:"photos", kind:"ask", type:"single", text:"How much should people see of each item?", default:"A few photos from different angles.", options:[
      {v:"one", label:"One photo", needs:["One good photo per item"]},
      {v:"few", label:"A few photos from different angles", needs:["Three to five photos per item"]},
      {v:"video", label:"Photos and a short video", needs:["A short video per item","Video hosting (pages load slower on weak connections)"]}]},
    {id:"soldout", kind:"must", type:"single", text:"What happens when a size sells out?", why:"This is a business choice about your stock, not a technical one.", options:[
      {v:"hide", label:"Hide that size"},
      {v:"show", label:"Show it as sold out"},
      {v:"notify", label:"Let people ask to be told when it is back", needs:["Emails or messages to say it is back"]},
      {v:"pre", label:"Let people pre-order it", needs:["Taking payment now and delivering later","A clear waiting time for each pre-order"]}]}
  ], suggestions:[
    {id:"new", text:"A \u201cNew arrivals\u201d section", why:"Gives returning shoppers a reason to look again.", needs:["A date on each item for when it was added"]},
    {id:"sizeguide", text:"A size guide", why:"Clothing stores get fewer returns when sizes are explained.", spawn:["sizeguide"]}]},

  sizeguide:{level:3, title:"Size guide", sub:"Helping people pick the right size", questions:[
    {id:"std", kind:"ask", type:"single", text:"What sizes do you use?", default:"Letter sizes: S, M, L, XL.", options:[
      {v:"letters", label:"Letter sizes (S, M, L)"},
      {v:"num", label:"UK or US number sizes"},
      {v:"own", label:"My own measurements", needs:["A measurement chart for each type of item"]}]},
    {id:"how", kind:"ask", type:"single", text:"How should the guide help?", default:"A chart people can read.", options:[
      {v:"chart", label:"A chart people can read"},
      {v:"quiz", label:"Ask their height and fit, then suggest a size", needs:["Your rules for which size suits whom"]}]}
  ]},

  buy:{level:2, title:"Buy and pay", sub:"Checkout, payment and delivery", questions:[
    {id:"pay", kind:"must", type:"multi", text:"How will you get paid?", why:"Each option changes your costs, your risk and who does the checking. Only you can weigh that.", options:[
      {v:"card", label:"Card payments online", needs:["A payment provider account (it takes a small fee per sale)"]},
      {v:"transfer", label:"Bank transfer", needs:["Someone to check each transfer by hand before shipping"]},
      {v:"cod", label:"Pay on delivery", needs:["Riders who can collect payment","A plan for deliveries that get refused"]}]},
    {id:"where", kind:"must", type:"single", text:"Where will you deliver?", why:"Your delivery area decides prices, partners and paperwork.", options:[
      {v:"city", label:"My city only", spawn:["delivery"]},
      {v:"country", label:"Across the country", spawn:["delivery"], needs:["A courier that covers the whole country"]},
      {v:"intl", label:"Other countries too", spawn:["delivery"], needs:["An international courier","Customs forms for each parcel","Prices in more than one currency"]}]},
    {id:"fail", kind:"must", type:"single", text:"If a payment fails, what should the customer see?", why:"The AI could guess, but a wrong guess loses sales or annoys customers.", options:[
      {v:"retry", label:"Try again, with the cart kept"},
      {v:"other", label:"Offer another way to pay"},
      {v:"remind", label:"Keep the cart and remind them later", needs:["Reminder emails or messages"]}]}
  ], suggestions:[
    {id:"codes", text:"Discount codes", why:"Useful for launches, sales and working with influencers.", spawn:["codes"]},
    {id:"receipt", text:"Send a receipt after every order", why:"Customers expect proof of what they bought.", needs:["An email service for receipts"]}]},

  delivery:{level:3, title:"Delivery", sub:"Getting orders to people", questions:[
    {id:"fee", kind:"must", type:"text", text:"Describe your delivery fee in your own words.", why:"Only you know your prices. Write it the way you would explain it to a customer.",
     placeholder:"For example: free on orders over a certain amount, otherwise a flat fee.",
     aiNote:"The AI turned this into a rule. One part was unclear, so it asks below instead of guessing."},
    {id:"feeq", kind:"must", type:"single", showIf:"fee", text:"Does the free-delivery amount count before or after discounts?", why:"Your description did not say, and each answer changes what customers pay.", options:[
      {v:"before", label:"Before discounts"},
      {v:"after", label:"After discounts"},
      {v:"na", label:"My fee has no free-delivery amount"}]},
    {id:"who", kind:"ask", type:"single", text:"Who does the delivering?", default:"A courier company.", options:[
      {v:"me", label:"Me or my team"},
      {v:"courier", label:"A courier company", needs:["An account with a courier company"]},
      {v:"pickup", label:"Customers pick up", needs:["A pickup address and opening hours"]}]}
  ]},

  codes:{level:3, title:"Discount codes", sub:"Money off at checkout", questions:[
    {id:"kinds", kind:"ask", type:"multi", text:"What kinds of discount?", default:"Percentage off only.", options:[
      {v:"pct", label:"Percentage off"},
      {v:"fixed", label:"A fixed amount off"},
      {v:"free", label:"Free delivery"}]},
    {id:"stack", kind:"must", type:"single", text:"Can someone use more than one code at once?", why:"Combined codes can wipe out your profit. This is your call.", options:[
      {v:"no", label:"No, one code per order"},
      {v:"yes", label:"Yes, they can combine codes"}]}
  ]},

  account:{level:2, title:"Have an account", sub:"Signing in and saved details", questions:[
    {id:"guest", kind:"must", type:"single", text:"Can people buy without making an account?", why:"Forcing sign-up gets you more contacts but loses some buyers. Only you can make that trade.", options:[
      {v:"yes", label:"Yes, guest checkout is fine"},
      {v:"no", label:"No, they must sign up first"}]},
    {id:"signin", kind:"ask", type:"single", text:"How should people sign in?", default:"Email with a one-time code, so nobody needs a password.", options:[
      {v:"pw", label:"Email and password", needs:["A way to reset forgotten passwords"]},
      {v:"code", label:"Email with a one-time code"},
      {v:"social", label:"Google or Apple sign-in", needs:["Setup with Google and Apple"]}]},
    {id:"delete", kind:"must", type:"single", text:"If someone asks you to delete their data, what do you keep?", why:"This depends on the rules where you operate and on your records. Check with someone qualified.", options:[
      {v:"all", label:"Delete everything"},
      {v:"orders", label:"Keep order records, delete the rest", needs:["A note of which records you keep, and why"]}]}
  ]},

  track:{level:2, title:"Track their order", sub:"After someone has paid", questions:[
    {id:"notify", kind:"ask", type:"multi", text:"How should they hear about updates?", default:"By email.", options:[
      {v:"email", label:"Email", needs:["An email service"]},
      {v:"sms", label:"Text message", needs:["A text message service (costs per message)"]},
      {v:"wa", label:"WhatsApp", needs:["A WhatsApp Business account"]}]},
    {id:"cancel", kind:"must", type:"single", text:"Can they cancel after paying?", why:"Cancellation rules affect refunds and your stock.", options:[
      {v:"no", label:"No"},
      {v:"ship", label:"Yes, until it ships"},
      {v:"time", label:"Yes, within a set time", needs:["Your cancellation time limit"]}]},
    {id:"returns", kind:"must", type:"single", text:"Do you accept returns?", why:"Your return policy is a promise to customers. It has to come from you.", options:[
      {v:"none", label:"No returns"},
      {v:"exchange", label:"Exchanges only"},
      {v:"refund", label:"Returns with a refund", needs:["A refund process with your payment provider","A written return policy"]}]}
  ]},

  fav:{level:2, title:"Save favourites", sub:"A wishlist for later", questions:[
    {id:"acct", kind:"ask", type:"single", text:"Should saving favourites need an account?", default:"Saved on their device, no account needed.", options:[
      {v:"yes", label:"Yes, favourites need an account"},
      {v:"device", label:"No, save them on their device", note:"They lose them if they switch phones."}]}
  ], suggestions:[
    {id:"sale", text:"Tell people when a favourite goes on sale", why:"Brings shoppers back at the right moment.", needs:["Emails or messages for sale alerts"]}]},

  reviews:{level:2, title:"Leave reviews", sub:"What other shoppers say", questions:[
    {id:"who", kind:"must", type:"single", text:"Who can leave a review?", why:"Open reviews bring more feedback, but also fake ones.", options:[
      {v:"any", label:"Anyone"},
      {v:"buyers", label:"Only people who bought the item"}]},
    {id:"check", kind:"must", type:"single", text:"Do you check reviews before they appear?", why:"This is about your brand and your time.", options:[
      {v:"yes", label:"Yes, I approve each one", needs:["Time set aside to approve reviews"]},
      {v:"no", label:"No, but I can remove them later"}]}
  ], suggestions:[
    {id:"photos", text:"Photos in reviews", why:"Shoppers trust real photos of how clothes fit.", needs:["Storage for customer photos"]}]},

  admin:{level:2, title:"Manage my store", sub:"Your side: stock and orders", questions:[
    {id:"who", kind:"ask", type:"single", text:"Who will manage the store?", default:"Just you.", options:[
      {v:"me", label:"Just me"},
      {v:"staff", label:"Me and staff", needs:["Staff logins that only see what they need"]}]},
    {id:"add", kind:"ask", type:"single", text:"How will you add new clothes?", default:"One at a time, with a simple form.", options:[
      {v:"one", label:"One at a time"},
      {v:"sheet", label:"Upload a spreadsheet", needs:["A spreadsheet template to fill in"]}]}
  ]}
};

/* ---------- State ---------- */
const STORE_KEY = "idea-tree-v1";
let S = {answers:{}, accepted:[], dismissed:[], sel:"idea", view:"guide"};
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K = (key, id) => key + "." + id;
const isAcc = k => S.accepted.includes(k);
const isDis = k => S.dismissed.includes(k);

function isAnswered(key, id){
  const a = S.answers[K(key, id)];
  if (a == null) return false;
  if (Array.isArray(a)) return a.length > 0;
  return String(a).trim().length > 0;
}
const isSkip = (key, id) => S.answers[K(key, id)] === "__skip";
function visible(key, q){ return !q.showIf || (isAnswered(key, q.showIf) && !isSkip(key, q.showIf)); }
function chosen(key, q){
  const a = S.answers[K(key, q.id)];
  if (!q.options || a == null || a === "__skip") return [];
  const vals = Array.isArray(a) ? a : [a];
  return q.options.filter(o => vals.includes(o.v));
}
function titleOf(key){ return key === "site" ? (SITE_T[S.answers["idea.platform"]] || "Where it lives") : DEF[key].title; }

function kids(key){
  const d = DEF[key], out = [];
  const add = arr => (arr || []).forEach(k => { if (!out.includes(k)) out.push(k); });
  d.questions.forEach(q => { if (visible(key, q)) chosen(key, q).forEach(o => add(o.spawn)); });
  (d.suggestions || []).forEach(s => { if (isAcc(K(key, s.id))) add(s.spawn); });
  return out;
}
function present(){
  const out = [];
  (function walk(k, depth){ out.push({key:k, depth}); kids(k).forEach(c => walk(c, depth + 1)); })("idea", 0);
  return out;
}
function counts(key){
  const d = DEF[key]; let must = 0, ask = 0, sug = 0;
  d.questions.forEach(q => { if (!visible(key, q) || isAnswered(key, q.id)) return; if (q.kind === "must") must++; else ask++; });
  (d.suggestions || []).forEach(s => { const k = K(key, s.id); if (!isAcc(k) && !isDis(k)) sug++; });
  return {must, ask, sug};
}
function collect(){
  const list = present(); const open = [], made = [], defaults = [], needs = []; const seen = new Set();
  const addNeed = (key, n) => { if (!seen.has(n)){ seen.add(n); needs.push({key, n}); } };
  list.forEach(({key}) => {
    const d = DEF[key];
    d.questions.forEach(q => {
      if (!visible(key, q)) return;
      if (q.kind === "must"){ (isAnswered(key, q.id) ? made : open).push({key, q}); }
      else if (isSkip(key, q.id)) defaults.push({key, q});
      chosen(key, q).forEach(o => (o.needs || []).forEach(n => addNeed(key, n)));
    });
    (d.suggestions || []).forEach(s => { if (isAcc(K(key, s.id))) (s.needs || []).forEach(n => addNeed(key, n)); });
  });
  return {list, open, made, defaults, needs};
}
function nextQ(){
  const list = present().slice().sort((a, b) => a.depth - b.depth);
  for (const {key} of list) for (const q of DEF[key].questions) if (visible(key, q) && !isAnswered(key, q.id)) return {key, id:q.id};
  return null;
}
function answerText(key, q){
  const a = S.answers[K(key, q.id)];
  if (q.type === "text") return a;
  return chosen(key, q).map(o => o.label).join(", ");
}

/* ---------- Render ---------- */
let prevKeys = null;
function render(){
  const list = present();
  if (!list.some(x => x.key === S.sel)) S.sel = "idea";
  const scroll = {g:$("#guide").scrollTop, t:$("#tree").scrollTop, n:$("#needs").scrollTop};
  const C = collect();
  renderHeader(C);
  renderTree(list);
  renderGuide();
  renderNeeds(C);
  $("#main").dataset.view = S.view;
  $("#guide").scrollTop = scroll.g; $("#tree").scrollTop = scroll.t; $("#needs").scrollTop = scroll.n;
  prevKeys = new Set(list.map(x => x.key));
  save();
}
function renderHeader(C){
  const total = C.open.length + C.made.length;
  $("#progTxt").innerHTML = "<b>" + C.made.length + " of " + total + "</b> decisions made";
  $("#progBar").style.width = (total ? 100 * C.made.length / total : 0) + "%";
  const cm = $("#cMust"); cm.textContent = C.open.length || ""; cm.hidden = !C.open.length;
  const cn = $("#cNeeds"); cn.textContent = C.needs.length || ""; cn.hidden = !C.needs.length;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === S.view || (S.view === "tree" && b.dataset.v === "guide" && window.innerWidth > 820))));
}
function renderTree(list){
  function node(key, depth){
    const c = counts(key);
    const pills = [];
    if (c.must) pills.push('<span class="pill red">' + c.must + " to decide</span>");
    if (c.ask) pills.push('<span class="pill">' + c.ask + " question" + (c.ask > 1 ? "s" : "") + "</span>");
    if (c.sug) pills.push('<span class="pill sug">' + c.sug + " suggestion" + (c.sug > 1 ? "s" : "") + "</span>");
    if (!c.must && !c.ask) pills.unshift('<span class="pill done">\u2713 All answered</span>');
    const isNew = prevKeys && !prevKeys.has(key);
    let h = '<div class="tnode depth' + depth + (isNew ? " appear" : "") + '">' +
      '<button class="card' + (S.sel === key ? " sel" : "") + (c.must ? " has-must" : "") + '" data-act="select" data-key="' + key + '">' +
      '<span class="lv">' + LV[DEF[key].level] + '</span><span class="ti">' + esc(titleOf(key)) + '</span><span class="su">' + esc(DEF[key].sub) + '</span>' +
      '<span class="pills">' + pills.join("") + "</span></button>";
    const ks = kids(key);
    if (ks.length) h += '<div class="children">' + ks.map(k => node(k, depth + 1)).join("") + "</div>";
    return h + "</div>";
  }
  $("#tree").innerHTML = '<div class="scale"><span>Broad</span><span>Specific</span></div>' + node("idea", 0);
}
function needsBox(list){
  if (!list.length) return "";
  return '<div class="needs"><b>This means you will need</b><ul>' + list.map(n => "<li>" + esc(n) + "</li>").join("") + "</ul></div>";
}
function qHTML(key, q){
  const k = K(key, q.id), a = S.answers[k], done = isAnswered(key, q.id), skipped = a === "__skip";
  let h = '<section class="q ' + q.kind + (done ? " done" : "") + '" id="q-' + key + "-" + q.id + '">';
  h += '<div class="qlabel">' + (q.kind === "must" ? '<span class="must-pill">You must decide</span>' : '<span class="ask-pill">Question</span>') +
    (done && !skipped ? '<span class="ok">\u2713 Answered</span>' : "") + "</div>";
  h += "<h3>" + esc(q.text) + "</h3>";
  if (q.hint) h += '<p class="qhint">' + esc(q.hint) + "</p>";
  if (q.why) h += '<p class="why"><b>Why it is yours to decide:</b> ' + esc(q.why) + "</p>";
  if (q.type === "text"){
    h += '<textarea id="ta-' + key + "-" + q.id + '" rows="3" placeholder="' + esc(q.placeholder || "") + '">' + esc(done ? a : "") + "</textarea>";
    h += '<button class="btn" data-act="savetext" data-key="' + key + '" data-q="' + q.id + '">' + (done ? "Update" : "Save") + "</button>";
    if (done && q.aiNote) h += '<p class="ainote">' + esc(q.aiNote) + "</p>";
  } else {
    h += '<div class="opts" role="group" aria-label="' + esc(q.text) + '">';
    q.options.forEach(o => {
      const on = skipped ? false : Array.isArray(a) ? a.includes(o.v) : a === o.v;
      h += '<button class="opt ' + q.type + '" aria-pressed="' + on + '" data-act="pick" data-key="' + key + '" data-q="' + q.id + '" data-v="' + o.v + '">' +
        '<span class="mark"></span><span><b>' + esc(o.label) + "</b>" + (o.note ? "<small>" + esc(o.note) + "</small>" : "") + "</span></button>";
    });
    h += "</div>";
    h += needsBox(chosen(key, q).flatMap(o => o.needs || []));
  }
  if (q.kind === "ask"){
    if (skipped) h += '<p class="skipnote">Skipped. The AI will use: ' + esc(q.default) + ' <button class="linkbtn" data-act="unskip" data-key="' + key + '" data-q="' + q.id + '">Answer instead</button></p>';
    else if (!done) h += '<p class="skipnote">If you skip: ' + esc(q.default) + ' <button class="linkbtn" data-act="skip" data-key="' + key + '" data-q="' + q.id + '">Skip and use this</button></p>';
  }
  return h + "</section>";
}
function sgHTML(key, s){
  const k = K(key, s.id);
  if (isDis(k)) return "";
  const acc = isAcc(k);
  let h = '<section class="sg' + (acc ? " acc" : "") + '"><div class="qlabel"><span class="sg-pill">Suggestion from the AI</span><span class="opt-note">Optional</span></div>';
  h += "<h3>" + esc(s.text) + '</h3><p class="qhint">' + esc(s.why) + "</p>";
  if (acc){
    h += '<p class="ok" style="margin:0">\u2713 Added to your plan</p>' + needsBox(s.needs || []) +
      '<p class="skipnote"><button class="linkbtn" data-act="unaccept" data-k="' + k + '">Remove it</button></p>';
  } else {
    h += '<div class="sgbtns"><button class="btn" data-act="accept" data-k="' + k + '">Add it</button><button class="btn ghost" data-act="dismiss" data-k="' + k + '">No thanks</button></div>';
  }
  return h + "</section>";
}
function renderGuide(){
  const key = S.sel, d = DEF[key];
  let h = '<div class="gin"><span class="lv">' + LV[d.level] + "</span><h2>" + esc(titleOf(key)) + '</h2><p class="su">' + esc(d.sub) + "</p>";
  if (key === "idea"){
    h += '<div class="intro"><p>Describe what you want, from broad to specific. The AI asks one level at a time, and each answer can open up the next, more detailed part.</p>' +
      '<div class="key"><div><span class="must-pill" style="font-size:12px;font-weight:700">You must decide</span> Only you can answer. The AI will not guess.</div>' +
      '<div><b style="font-size:12.5px;color:var(--ink-2)">Question</b> Helps the AI. Skip it and it uses a sensible default, and tells you which.</div>' +
      '<div><b style="font-size:12.5px;color:var(--sug)">Suggestion</b> An idea from the AI. Completely optional.</div></div></div>';
  }
  d.questions.forEach(q => { if (visible(key, q)) h += qHTML(key, q); });
  const sgs = (d.suggestions || []).map(s => sgHTML(key, s)).join("");
  if (sgs) h += '<div class="sec">Ideas the AI noticed</div>' + sgs;
  const ks = kids(key);
  if (ks.length) h += '<div class="sec">Parts that grew from this</div><div class="parts">' + ks.map(k => '<button data-act="select" data-key="' + k + '">' + esc(titleOf(k)) + "</button>").join("") + "</div>";
  h += "</div>";
  const nx = nextQ();
  h += '<div class="nextbar"><button class="next" data-act="next">' + (nx ? "Next question" : "Everything is answered. See what it needs") + "</button></div>";
  $("#guide").innerHTML = h;
}
function renderNeeds(C){
  let h = '<div class="nin"><h2>What it needs</h2><p>Everything your answers add up to, in plain language.</p>';
  if (C.open.length){
    h += '<div class="status red"><strong>' + C.open.length + " decision" + (C.open.length > 1 ? "s" : "") + " still need you</strong><p>Nothing gets built around a gap. These are the answers the AI will not guess.</p><ul class=\"jl\">" +
      C.open.map(o => '<li><button data-act="goto" data-key="' + o.key + '" data-q="' + o.q.id + '">' + esc(o.q.text) + "<small>" + esc(titleOf(o.key)) + "</small></button></li>").join("") + "</ul></div>";
  } else {
    h += '<div class="status ok"><strong>Every must-decide question is answered.</strong><p>Your plan is ready to become a technical node graph, where each part turns into nodes with code inside. <a href="' + TECH_URL + '" target="_blank" rel="noopener">See what that looks like</a>.</p></div>';
  }
  h += '<div class="sec">You will need</div>';
  if (C.needs.length){
    const groups = {};
    C.needs.forEach(n => (groups[n.key] = groups[n.key] || []).push(n.n));
    Object.keys(groups).forEach(k => { h += '<div class="group"><h4>' + esc(titleOf(k)) + "</h4><ul>" + groups[k].map(n => "<li>" + esc(n) + "</li>").join("") + "</ul></div>"; });
  } else h += '<p class="empty">Nothing yet. Answer a few questions and this list fills in.</p>';
  h += '<div class="sec">Decisions you made</div>';
  h += C.made.length ? '<div class="dl">' + C.made.map(m => "<div><span>" + esc(m.q.text) + "</span>" + esc(answerText(m.key, m.q)) + "</div>").join("") + "</div>" : '<p class="empty">None yet.</p>';
  if (C.defaults.length){
    h += '<div class="sec">Left to the AI\u2019s defaults</div><div class="dl">' + C.defaults.map(m => "<div><span>" + esc(m.q.text) + "</span>" + esc(m.q.default) + "</div>").join("") + "</div>";
  }
  $("#needs").innerHTML = h + "</div>";
}

/* ---------- Actions ---------- */
function goTo(key, id){
  S.sel = key; S.view = "guide"; render();
  const el = document.getElementById("q-" + key + "-" + id);
  if (el){ el.scrollIntoView({block:"center", behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, key = t.dataset.key, qid = t.dataset.q;
  if (act === "select"){ S.sel = key; S.view = "guide"; render(); $("#guide").scrollTop = 0; }
  else if (act === "view"){ S.view = t.dataset.v; render(); }
  else if (act === "pick"){
    const q = DEF[key].questions.find(x => x.id === qid), k = K(key, qid), v = t.dataset.v;
    let a = S.answers[k]; if (a === "__skip") a = undefined;
    if (q.type === "multi"){ a = Array.isArray(a) ? a.slice() : []; a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v); if (!a.length) a = undefined; }
    else a = a === v ? undefined : v;
    if (a === undefined) delete S.answers[k]; else S.answers[k] = a;
    render();
  }
  else if (act === "savetext"){
    const v = document.getElementById("ta-" + key + "-" + qid).value.trim(), k = K(key, qid);
    if (v) S.answers[k] = v; else delete S.answers[k];
    render();
  }
  else if (act === "skip"){ S.answers[K(key, qid)] = "__skip"; render(); }
  else if (act === "unskip"){ delete S.answers[K(key, qid)]; render(); }
  else if (act === "accept"){ if (!isAcc(t.dataset.k)) S.accepted.push(t.dataset.k); render(); }
  else if (act === "unaccept"){ S.accepted = S.accepted.filter(x => x !== t.dataset.k); render(); }
  else if (act === "dismiss"){ S.dismissed.push(t.dataset.k); render(); }
  else if (act === "next"){ const n = nextQ(); if (n) goTo(n.key, n.id); else { S.view = "needs"; render(); $("#needs").scrollTop = 0; } }
  else if (act === "goto") goTo(key, qid);
  else if (act === "reset"){
    if (!t.dataset.armed){ t.dataset.armed = "1"; t.textContent = "Tap again to clear"; setTimeout(() => { delete t.dataset.armed; t.textContent = "Start over"; }, 3000); return; }
    delete t.dataset.armed; t.textContent = "Start over";
    S = {answers:{}, accepted:[], dismissed:[], sel:"idea", view:"guide"}; prevKeys = null; render();
    $("#guide").scrollTop = 0; $("#tree").scrollTop = 0;
  }
});
window.addEventListener("resize", () => renderHeader(collect()));
render();
</script>
