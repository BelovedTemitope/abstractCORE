<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea graph studio: a stem separation tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#ECEEF3; --dot:#C9CEDA; --surface:#FFFFFF; --surface-2:#F4F5F9; --ink:#1B2130; --ink-2:#5A6275; --line:#D5D9E3;
  --you:#0E7C66; --ai:#6B4FD8; --lib:#A86A12; --doc:#7A6A55; --flag:#CF3F28; --flag-bg:#FCEBE7; --sys:#3B5FA8; --ext:#6F7788;
  --edge:#8D95A8; --hi:#1B2130;
  --code-bg:#1C2230; --code-ink:#DCE2EE; --code-cm:#8C97AD; --code-st:#A9D8A2; --code-kw:#98B9FF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#151923; --dot:#2A3040; --surface:#1F2431; --surface-2:#191E29; --ink:#E4E8F1; --ink-2:#9AA3B6; --line:#323A4B;
    --you:#43C6A6; --ai:#A794FF; --lib:#E0A548; --doc:#BFAE95; --flag:#FF7A63; --flag-bg:#3A1F1A; --sys:#86A7F0; --ext:#9AA3B6;
    --edge:#6E7890; --hi:#E4E8F1; --code-bg:#121620;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#151923; --dot:#2A3040; --surface:#1F2431; --surface-2:#191E29; --ink:#E4E8F1; --ink-2:#9AA3B6; --line:#323A4B;
  --you:#43C6A6; --ai:#A794FF; --lib:#E0A548; --doc:#BFAE95; --flag:#FF7A63; --flag-bg:#3A1F1A; --sys:#86A7F0; --ext:#9AA3B6;
  --edge:#6E7890; --hi:#E4E8F1; --code-bg:#121620;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--canvas);color:var(--ink);
  font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2.5px solid var(--ai);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:9px 16px 8px;display:grid;gap:8px}
.r1,.r2{display:flex;align-items:center;gap:12px;justify-content:space-between;min-width:0}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.steps{display:flex;align-items:center;gap:6px;font-size:13.5px}
.step{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:3px 11px;color:var(--ink-2);white-space:nowrap;font-weight:600}
.step.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.step{cursor:pointer}
button.step:hover{border-color:var(--ink-2)}
.steps .arrow{color:var(--ink-2)}
.restart{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.up{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:14px;flex:none}
.up:disabled{opacity:.4;cursor:default}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.crumbs li{display:flex;align-items:center;gap:4px;font-size:14px}
.crumbs li+li::before{content:"›";color:var(--ink-2)}
.crumbs li button{border:0;background:none;padding:2px 4px;cursor:pointer;color:var(--ink-2);border-radius:5px}
.crumbs li button:hover{color:var(--ink);text-decoration:underline}
.crumbs [aria-current]{font-weight:700;padding:2px 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface-2);flex:none}
.seg button{border:0;background:transparent;padding:4px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.mtabs{display:none}

/* Main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stagewrap{position:relative;min-height:0;overflow:hidden}
.canvas{position:absolute;inset:0;overflow:auto;display:flex;
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:20px 20px}
.stage{position:relative;margin:auto;flex:none}
.lensnote{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:absolute;top:12px;left:12px;z-index:3;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 11px;color:var(--ink-2);max-width:calc(100% - 170px)}
.lensnote b{color:var(--ink)}
.addbtn{position:absolute;top:10px;right:12px;z-index:3;border:0;background:var(--you);color:#fff;border-radius:10px;padding:7px 13px;font-weight:700;cursor:pointer}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
.empty{margin:auto;max-width:360px;text-align:center;padding:24px;color:var(--ink-2)}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:18px}
.empty button{margin-top:12px}

.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--edge);stroke-width:1.8}
.edges path.hi{stroke:var(--hi);stroke-width:2.4}
.edges path.dim,.edges text.dim{opacity:.25}
.edges circle{fill:var(--surface);stroke:var(--edge);stroke-width:1.6}
.edges text{font-size:11.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}

.node{position:absolute;--tc:var(--you);display:flex;flex-direction:column;padding:0;text-align:left;cursor:pointer;z-index:1;
  background:var(--surface);border:1.6px solid color-mix(in srgb,var(--tc) 55%,var(--line));border-radius:11px}
.node .hd{display:flex;justify-content:space-between;gap:6px;align-items:center;background:color-mix(in srgb,var(--tc) 14%,var(--surface));color:var(--tc);font-size:12px;font-weight:700;padding:3px 10px;border-radius:9px 9px 0 0;white-space:nowrap}
.node .hd .dec{color:var(--ai);font-weight:700;font-size:11px;background:var(--surface);border-radius:10px;padding:0 6px}
.node .bd{flex:1;overflow:hidden;padding:6px 10px 8px}
.node .tt{font-weight:650;font-size:14.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node .sm{font-size:12.5px;color:var(--ink-2);line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.compact .sm{display:none}
.node.stack{box-shadow:5px 5px 0 -1.6px var(--surface-2),5px 5px 0 0 color-mix(in srgb,var(--tc) 40%,var(--line))}
.node.by-ai{--tc:var(--ai)}
.node.lib{--tc:var(--lib);border-width:3px;border-style:double}
.node.libpart{--tc:var(--doc);border-style:dashed}
.node.sys{--tc:var(--sys)}
.node.sys.ext{--tc:var(--ext);border-style:dashed}
.node.sys.draft{border-style:dashed}
.node.sys.slib{--tc:var(--lib);border-width:3px;border-style:double}
.node.sys.ph{--tc:var(--ext);border-style:dashed;opacity:.8}
.node.sel{outline:2.5px solid var(--tc);outline-offset:3px}
.node:hover{border-color:var(--tc)}
.node:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px}
.badge{position:absolute;top:-10px;right:-10px;width:23px;height:23px;border-radius:12px;background:var(--flag);color:#fff;font-size:13px;font-weight:800;display:grid;place-items:center;border:2px solid var(--canvas)}
.appear{animation:appear .4s ease-out}
@keyframes appear{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.anim-in{animation:zin .28s cubic-bezier(.2,.7,.2,1)}
.anim-out{animation:zout .24s cubic-bezier(.2,.7,.2,1)}
@keyframes zin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes zout{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.appear,.anim-in,.anim-out{animation:none}}

/* Sheet */
.stagewrap.sheet-open .canvas{right:392px}
.stagewrap.sheet-open .addbtn{right:404px}
.stagewrap.sheet-open .sheet{top:10px;right:10px;bottom:10px;left:auto;width:372px;max-height:none}
.sheet{position:absolute;left:12px;bottom:12px;z-index:4;width:min(540px,calc(100% - 24px));max-height:60%;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(20,25,40,.18);padding:14px 16px 16px}
.sheet[hidden]{display:none}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.close{border:0;background:var(--surface-2);border-radius:8px;width:30px;height:30px;cursor:pointer;flex:none;font-size:18px;line-height:1}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:20px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.sheet h3{font-size:19px;margin:4px 0 4px;line-height:1.25}
.sheet p{margin:0 0 8px}
.muted{color:var(--ink-2);font-size:14px}
.flagbox{background:var(--flag-bg);border:1.5px solid var(--flag);border-radius:12px;padding:10px 12px;margin:10px 0}
.flagbox strong{color:var(--flag);font-size:13px;display:block}
.flagbox p{margin:2px 0 8px;font-size:14.5px}
.decbox{border:1.5px solid color-mix(in srgb,var(--ai) 45%,var(--line));background:color-mix(in srgb,var(--ai) 7%,var(--surface));border-radius:12px;padding:10px 12px;margin:10px 0}
.decbox strong{color:var(--ai);font-size:13px;display:block}
.decbox .dt{font-size:15px;font-weight:600;margin:2px 0 4px}
.decbox .why{font-size:14px;color:var(--ink-2);margin:0 0 8px}
.decbox.mine{border-color:color-mix(in srgb,var(--you) 50%,var(--line));background:color-mix(in srgb,var(--you) 7%,var(--surface))}
.decbox.mine strong{color:var(--you)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:0;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--surface);font-size:14px}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.alt:hover{border-color:var(--ink-2)}
.btn.you{background:var(--you);color:#fff}
.btn.full{width:100%;margin-top:10px;padding:9px 12px}
.opts{display:grid;gap:6px;margin-top:4px}
.opts .btn{text-align:left}
textarea,input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--surface-2)}
textarea{resize:vertical;min-height:60px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:8px 0 3px}
.conn{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.conn li{color:var(--ink-2)}
.conn b{color:var(--ink);font-weight:600}
.hbtns{display:flex;gap:6px;flex:none}
.sh{display:none}
.take{border:0;background:var(--you);color:#fff;border-radius:8px;padding:4px 11px;cursor:pointer;font-size:13.5px;font-weight:700;white-space:nowrap}
.logbtn{position:absolute;top:10px;right:12px;z-index:3;border:1.5px solid color-mix(in srgb,var(--ai) 45%,var(--line));background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
.stagewrap.sheet-open .logbtn{right:404px}
.stats div:first-child{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 4px}
.stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13.5px;font-weight:600;line-height:1.3}
.stats span{display:block;font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:2px}
.log{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.log li{border-left:3px solid var(--ai);padding:2px 0 2px 10px;font-size:14px}
.log b{display:block;font-size:12.5px;color:var(--ai)}
.node.sys.s-you{--tc:var(--you)}
.node.sys.s-ai{--tc:var(--ai)}
.sec{font-size:13px;font-weight:700;color:var(--ink-2);margin:12px 0 2px}
.linkbtn{border:0;background:none;padding:0;color:var(--flag);cursor:pointer;text-decoration:underline;font-size:13.5px;margin-top:10px}
pre.code{margin:8px 0 0;background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:10px 0;overflow:auto;
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6}
pre.code code{display:inline-block;min-width:100%}
.ln{display:block;padding:0 14px;white-space:pre}
.ln.dec{box-shadow:inset 3px 0 0 var(--ai);background:color-mix(in srgb,var(--ai) 18%,transparent)}
.ln.mine{box-shadow:inset 3px 0 0 var(--you);background:color-mix(in srgb,var(--you) 18%,transparent)}
.cm{color:var(--code-cm);font-style:italic}.st{color:var(--code-st)}.kw{color:var(--code-kw)}

/* Chat */
.chat{background:var(--surface);border-left:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
.chathead{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.chathead b{font-size:15.5px}
.chathead p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.msgs{overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45}
.msg.ai{background:color-mix(in srgb,var(--ai) 10%,var(--surface-2));border:1px solid color-mix(in srgb,var(--ai) 25%,var(--line));border-bottom-left-radius:4px;align-self:flex-start}
.msg.you{background:var(--ink);color:var(--surface);border-bottom-right-radius:4px;align-self:flex-end}
.msg.sys{align-self:center;background:none;color:var(--ink-2);font-size:12.5px;padding:0 4px;text-align:center}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ai);opacity:.5;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1.5px solid color-mix(in srgb,var(--ai) 40%,var(--line));background:var(--surface);color:var(--ink);border-radius:14px;padding:4px 10px;font-size:13.5px;cursor:pointer;text-align:left}
.chips button:hover{border-color:var(--ai)}
.chips button:disabled{opacity:.5;cursor:default}
.inrow{display:flex;gap:6px}
.inrow input{flex:1}
.demo{font-size:12px;color:var(--ink-2);margin-top:6px}

@media (max-width:860px){
  .main{grid-template-columns:minmax(0,1fr)}
  .chat{border-left:0}
  .main[data-tab="graph"] .chat{display:none}
  .main[data-tab="chat"] .stagewrap{display:none}
  .mtabs{display:flex;gap:4px}
  .mtabs button{border:0;background:none;padding:5px 12px;border-radius:8px;font-weight:700;color:var(--ink-2);cursor:pointer;font-size:14px}
  .mtabs button[aria-pressed="true"]{background:color-mix(in srgb,var(--ai) 14%,var(--surface));color:var(--ink)}
  .steps .arrow,.steps .step:not(.on),.brand{display:none}
  .stagewrap.sheet-open .canvas{right:0;padding-bottom:60vh}
  .stagewrap.sheet-open .addbtn,.stagewrap.sheet-open .logbtn{right:12px}
  .stats{grid-template-columns:1fr 1fr}
  .lg{display:none} .sh{display:inline}
  .r1{gap:6px}
  .restart,.take{padding:4px 9px}
  .stagewrap.sheet-open .sheet{top:auto;left:8px;right:auto;bottom:8px;width:calc(100% - 16px);max-height:58%}
  .top{padding:8px 12px}
  .lensnote{max-width:calc(100% - 140px)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="r1">
      <span class="brand">Idea graph studio</span>
      <div class="steps" id="steps"></div>
      <div class="hbtns"><button class="take" data-act="take">Take it away</button><button class="restart" data-act="restart">Restart</button></div>
    </div>
    <div class="r2">
      <nav class="crumbs" aria-label="Levels">
        <button class="up" id="up" data-act="up" aria-label="Up one level">↑ Up</button>
        <ol id="crumbs"></ol>
      </nav>
      <div class="seg" role="group" aria-label="Lens">
        <button data-act="lens" data-l="ideas">Ideas</button>
        <button data-act="lens" data-l="system">System</button>
      </div>
    </div>
    <div class="mtabs" role="group" aria-label="Panels">
      <button data-act="tab" data-t="graph">Graph</button>
      <button data-act="tab" data-t="chat">Assistant</button>
    </div>
  </header>
  <div class="main" id="main" data-tab="graph">
    <div class="stagewrap">
      <main class="canvas" id="canvas"></main>
      <div class="lensnote" id="lensnote"></div>
      <button class="addbtn" id="addbtn" data-act="add">+ Add node</button>
      <button class="logbtn" id="logbtn" data-act="log" hidden><span class="lg">What changed</span><span class="sh">Changes</span></button>
      <div class="hint" id="hint">Tap a node to see it. Tap again to open it.</div>
      <aside class="sheet" id="sheet" hidden aria-live="polite"></aside>
    </div>
    <section class="chat" aria-label="Assistant">
      <div class="chathead"><b>Assistant</b><p>Tell it what you want when you’re not sure how to make the node.</p></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="chips" id="chips"></div>
        <form class="inrow" id="form" autocomplete="off">
          <input type="text" id="inp" placeholder="Describe what you want…" aria-label="Message">
          <button class="btn" type="submit">Send</button>
        </form>
        <div class="demo">Scripted demo: tap a suggestion, or type something close to one.</div>
      </div>
    </section>
  </div>
</div>

<script>
/* ================= State ================= */
let S;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));

function addNode(id, parent, title, desc, by, extra){
  S.nodes[id] = Object.assign({id, parent, title, desc, by, kind:"idea"}, extra || {});
}
const kids = id => Object.values(S.nodes).filter(n => n.parent === id).map(n => n.id);
function removeNode(id){
  kids(id).forEach(removeNode);
  delete S.nodes[id];
  S.edges = S.edges.filter(e => e[0] !== id && e[1] !== id);
}
const has = id => !!S.nodes[id];
function pathTo(id){ const p = []; let c = S.nodes[id] && S.nodes[id].parent; while (c && c !== "root"){ p.unshift(c); c = S.nodes[c].parent; } return p; }
const cur = () => S.path.length ? S.path[S.path.length - 1] : "root";
const titleOf = id => id === "root" ? "My idea" : S.nodes[id].title;

function reset(){
  S = {nodes:{}, edges:[], path:[], sel:null, lens:"ideas", phase:1, done:{}, sep:"api", sepText:"", formats:null, model:null,
       changing:null, adding:false, chat:[], typing:false, tab:"graph", uc:0, sysSel:null, sysPath:[], busy:false, seen:null,
       sysSig:null, sysTitles:{}, sysAreas:{}, sysVersion:1, sysChanged:new Set(), sysAdded:new Set(), changelog:[], sheetMode:null, addPrefill:"", dlStatus:""};
  addNode("tool", "root", "A stem separation tool", "Split any song into separate parts: vocals, drums, bass and the rest.", "you");
  addNode("load", "tool", "Load a song", "Pick a song file to work on.", "you");
  addNode("split", "tool", "Split into stems", "Vocals, drums, bass and everything else, as separate tracks.", "you");
  addNode("listen", "tool", "Listen to each stem", "Play the stems on their own or together.", "you");
  addNode("save", "tool", "Save the stems", "Keep each stem as its own file.", "you");
  S.edges.push(["load", "split", "The song"], ["split", "listen", "Four stems"], ["split", "save", "Four stems"]);
  S.chat.push({from:"ai", text:"Hi. Describe your tool as nodes, in your own words. You’ve already started with a few. Open “A stem separation tool” to see them."},

/* ================= Code highlight ================= */
const KW = new Set("const auto void for return struct class public bool float int if else true false".split(" "));
function hlLine(line){
  const re = /(\/\/.*)|("(?:[^"\\]|\\.)*")|([A-Za-z_]\w*)/g; let out = "", last = 0, m;
  while ((m = re.exec(line))){
    out += esc(line.slice(last, m.index));
    if (m[1]) out += '<span class="cm">' + esc(m[1]) + "</span>";
    else if (m[2]) out += '<span class="st">' + esc(m[2]) + "</span>";
    else out += KW.has(m[3]) ? '<span class="kw">' + m[3] + "</span>" : esc(m[3]);
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
function hl(code){
  return code.trim().split("\n").map(l => {
    const t = l.trim(); let c = "";
    if (t.startsWith("//") && /AI decision|Filled in by AI/.test(t)) c = " dec";
    else if (t.startsWith("//") && /\/\/ (Your |From your idea)/.test(t)) c = " mine";
    return '<span class="ln' + c + '">' + (l ? hlLine(l) : " ") + "</span>";
  }).join("");
}

    const n = T[S.sysSel], from = n.from && S.nodes[n.from], k = sysKids(T, n.id);
    const tc = {idea:"var(--you)", change:"var(--you)", ai:"var(--ai)", lib:"var(--lib)", ext:"var(--ext)"}[n.src];
    h = '<div class="shead"><div><span class="chip" style="--tc:' + tc + '">' + esc(SRC_TAG[n.src]) + "</span><h3>" + esc(n.title) + '</h3></div><button class="close" data-act="sysdeselect" aria-label="Close">×</button></div>';
    if (n.note) h += '<p class="muted">' + esc(n.note) + "</p>";
    if (from) h += '<p class="muted">Built from your idea: <b>' + esc(from.title) + "</b></p>";
    else if (n.src === "ai") h += '<p class="muted">You haven’t described this yet, so the AI chose it. Describe it in your own words to take it over.</p>';
    if (k.length){
      const L = sysLeaves(T, n.id);
      h += '<p class="muted">' + L.filter(l => mineSrc(T[l].src)).length + " of " + L.length + " parts come from your ideas.</p>";
      h += '<button class="btn full" data-act="sysopen" data-id="' + n.id + '">Open it (' + k.length + " inside)</button>";
    } else if (n.code) h += '<pre class="code"><code>' + hl(n.code) + "</code></pre>";
    if (from) h += '<button class="btn alt full" data-act="toidea" data-id="' + n.from + '">Show the idea it came from</button>';
    else if (n.src === "ai") h += '<button class="btn alt full" data-act="describe" data-t="' + esc(n.title) + '">Describe this yourself</button>';
  }
  sh.hidden = !h; sh.innerHTML = h;
}

/* ================= Chat ================= */
const SCRIPTS = [
  {id:"plugin", prompt:"I want this to work as a plugin inside my music software", match:/plugin|daw|ableton|logic|fl studio|vst|music software/i,
   avail:() => S.phase === 1 && !S.done.plugin,
   async run(){
     await say("Got it. I’ll add that as its own node, connected to where the audio comes from.");
     addNode("plugin", "tool", "Works as a plugin", "Runs inside music software, on a track.", "ai",
       {flag:{text:"Which music software? Plugin formats differ: VST3 works in most, and Logic Pro needs AU.",
         options:[{label:"Ableton, FL Studio and others (VST3)", act:"fmt-vst"},{label:"Logic Pro (AU)", act:"fmt-au"},{label:"Both", act:"fmt-both"}]}});
     S.edges.push(["plugin", "load", "Audio from the track"]);
     go(["tool"], "plugin"); await wait(900);
     addNode("p1", "plugin", "Shows up in the plugin list", "People add it to a track like any other effect.", "ai");
     addNode("p2", "plugin", "Takes audio from its track", "No need to load a file.", "ai");
     addNode("p3", "plugin", "Sends each stem to its own track", "So people can mix them right away.", "ai");
     S.edges.push(["p1", "p2", ""], ["p2", "p3", "Four stems"]);
     go(["tool", "plugin"], null, true);
     await say("I opened it and sketched what “works as a plugin” means, in three nodes. Change or delete anything that isn’t right. One thing I won’t guess: which music software you use. It’s flagged on the node.");
   }},
  {id:"batch", prompt:"Can it split a whole folder of songs at once?", match:/folder|batch|many songs|multiple songs|at once/i,
   avail:() => S.phase === 1 && !S.done.batch,
   async run(){
     await say("Yes. I’ve added it next to “Load a song”.");
     const conflict = has("plugin");
     addNode("batch", "tool", "Split a whole folder at once", "Pick a folder and every song in it gets split.", "ai",
       conflict ? {flag:{text:"This clashes with the plugin: a plugin only sees the track it’s on, so it can’t open a folder. Should the tool also be a standalone app?",
         options:[{label:"Yes, a plugin and a standalone app", act:"batch-app"},{label:"No, drop batch splitting", act:"batch-drop"}]}} : null);
     S.edges.push(["batch", "split", "One song at a time"]);
     go(["tool"], "batch");
     if (conflict) await say("There’s a conflict with “Works as a plugin”, so I flagged it instead of choosing for you.");
   }},
  {id:"bleed", prompt:"I’m not sure how to describe cleaning up sounds leaking between stems", match:/bleed|leak|clean/i,
   avail:() => S.phase === 1 && !S.done.bleed,
   async run(){
     await say("That’s called bleed: a bit of one instrument ending up in another stem, like faint drums in the vocals. It belongs inside “Split into stems”, so I’ll put it there.");
     go(["tool"], "split"); await wait(700);
     addNode("bleed", "split", "Reduce bleed between stems", "Lower what each stem picks up from the others.", "ai");
     if (has("backing")) S.edges.push(["bleed", "backing", "Vocal stem"]);
     go(["tool", "split"], "bleed", true);
   }},
  {id:"backing", prompt:"Also split the vocals into lead and backing", match:/backing|lead|harmon/i,
   avail:() => S.phase === 1 && !S.done.backing,
   async run(){
     await say("Added inside “Split into stems”. It works on the vocal stem only.");
     go(["tool"], "split"); await wait(700);
     addNode("backing", "split", "Separate lead and backing vocals", "Two vocal stems instead of one.", "ai");
     if (has("bleed")) S.edges.push(["bleed", "backing", "Vocal stem"]);
     go(["tool", "split"], "backing", true);
   }},
  {id:"build", prompt:"Build my starter project", match:/build|starter|project|ready/i,
   avail:() => S.phase === 1,
   async run(){
     await say("Bringing my background choices into your idea graph…", 1200);
     applyBuild();
     const n = Object.values(S.nodes).filter(x => x.decision).length;
     go(["tool"], null, true);
     await say("Done. Your ideas are unchanged. The finished tool in System already relied on these choices; now " + n + " of them are marked “AI decision” right on your nodes, so you can keep each one or change it, in as much detail as you like.");
     await say("The biggest one is how songs get split. Open “Split into stems” to see it. Every change you make flows into the finished system.");
     const fl = Object.values(S.nodes).filter(x => x.flag).length;
     if (fl) await say(fl + " flag" + (fl > 1 ? "s are" : " is") + " still waiting on you. They’re the red badges.");
   }},
  {id:"why", prompt:"Why use an online service for splitting?", match:/why|online|service|api/i,
   avail:() => S.phase === 2 && S.sep === "api",
   async run(){
     await say("It gets you working results fastest: a good separation model already exists as a service. The trade-offs are cost per song, needing internet, and songs leaving the user’s computer. If any of those matter, change it and describe what you want instead.");
     go(["tool", "split"], "s-up");
   }},
  {id:"change", prompt:"I don’t want songs uploaded anywhere", match:/upload|offline|privacy|local|computer|don.t want/i,
   avail:() => S.phase === 2 && S.sep === "api",
   async run(){
     await say("Then the model has to run on the user’s computer. I’ve opened the decision so you can switch it.");
     S.changing = "s-up"; go(["tool", "split"], "s-up");
   }},
  {id:"lib", prompt:"What is the model runtime library?", match:/runtime|library|onnx/i,
   avail:() => S.phase === 2 && S.sep === "local",
   async run(){
     await say("It’s a ready-made library that runs AI models on a normal computer. Rather than hiding it, I made the whole library one node. Open it to see what it offers, taken from its documentation, or switch to System to see the code that uses it.");
     go(["tool", "split"], "s-lib");
   }}
];
async function say(text, delay){
  S.typing = true; renderChat();
  await wait(delay || 650);
  S.typing = false; S.chat.push({from:"ai", text}); renderChat();
}
function go(path, sel, anim){
  S.lens = "ideas"; S.path = path; S.sel = sel; S.adding = false;
  if (window.innerWidth <= 860) S.tab = "graph";
  render(anim ? {dir:"in"} : null);
}
async function runScript(sc, typed){
  if (S.busy) return;
  S.busy = true;
  S.chat.push({from:"you", text:typed || sc.prompt}); renderChat();
  try { await sc.run(); } finally { S.done[sc.id] = true; S.busy = false; render(); }
}
async function handleTyped(text){
  const sc = SCRIPTS.find(s => s.avail() && s.match.test(text));
  if (sc) return runScript(sc, text);
  if (S.busy) return;
  S.chat.push({from:"you", text}); renderChat();
  S.busy = true;
  await say("This demo is scripted, so I can only act on the suggested messages. In the full tool I’d turn that into a node and put it where it fits. You can also add it yourself with “+ Add node”.");
  S.busy = false; renderChat();
}
function renderChat(){
  const m = $("#msgs");
  m.innerHTML = S.chat.map(c => '<div class="msg ' + c.from + '">' + esc(c.text) + "</div>").join("") +
    (S.typing ? '<div class="msg ai typing" aria-label="Assistant is typing"><i></i><i></i><i></i></div>' : "");
  m.scrollTop = m.scrollHeight;
  $("#chips").innerHTML = SCRIPTS.filter(s => s.avail()).map(s => '<button data-act="chip" data-s="' + s.id + '"' + (S.busy ? " disabled" : "") + ">" + esc(s.prompt) + "</button>").join("");
}

/* ================= Flag & decision effects ================= */
async function applyFlag(id, i){
  const n = S.nodes[id], o = n.flag.options[i];
  delete n.flag;
  if (o.act.startsWith("fmt-")){
    S.formats = o.act.slice(4);
    n.desc = "Runs inside music software, on a track. Format: " + {vst:"VST3", au:"AU", both:"VST3 and AU"}[S.formats] + ".";
    render(); await say("Noted: " + o.label + ". The plugin wrapper in the System lens now builds that format.");
  } else if (o.act === "batch-app"){
    addNode("standalone", "tool", "Also works as a standalone app", "Its own window, outside music software.", "ai");
    S.edges.push(["standalone", "batch", "Runs it"]);
    if (S.phase === 2) S.nodes.standalone.decision = Object.assign({state:"open"}, decisions().standalone);
    S.sel = "standalone"; render(); await say("Added “Also works as a standalone app”. Batch splitting runs there.");
  } else if (o.act === "batch-drop"){
    removeNode("batch"); S.sel = null; render(); await say("Removed batch splitting.");
  } else if (o.act.startsWith("model-")){
    S.model = o.act.slice(6);
    n.desc = "The AI model ships with the tool, about 300 MB, " + (S.model === "installer" ? "inside the installer." : "downloaded on first use.");
    render(); await say("Noted. The model file in the System lens follows your choice.");
  }
}

/* ================= Events ================= */
document.addEventListener("click", async e => {
  const nodeEl = e.target.closest(".node");
  if (nodeEl){
    const id = nodeEl.dataset.node;
    if (S.lens === "system"){
      S.sheetMode = null;
      const G = buildSystem();
      if (S.sysSel === id && sysKids(G.T, id).length){ S.sysPath = [...S.sysPath, id]; S.sysSel = null; render({dir:"in", x:e.clientX, y:e.clientY}); }
      else { S.sysSel = id; render(); }
      return;
    }
    S.sheetMode = null;
    if (S.sel === id){ S.path = [...S.path, id]; S.sel = null; S.adding = false; render({dir:"in", x:e.clientX, y:e.clientY}); }
    else { S.sel = id; S.adding = false; S.changing = null; render(); }
    return;
  }
  const t = e.target.closest("[data-act]");
  if (!t){
    if (e.target.closest("#canvas")){ if (S.lens === "ideas" && S.sel){ S.sel = null; render(); } else if (S.sysSel){ S.sysSel = null; render(); } }
    return;
  }
  const a = t.dataset.act, id = t.dataset.id;
  if (a === "lens"){ S.lens = t.dataset.l; S.sysSel = null; S.adding = false; S.sheetMode = null; render({dir:"in"}); }
  else if (a === "tab"){ S.tab = t.dataset.t; render(); }
  else if (a === "up"){
    if (S.lens === "system"){ const from = S.sysPath.pop(); S.sysSel = from || null; }
    else { const from = S.path.pop(); S.sel = from || null; S.adding = false; }
    S.sheetMode = null; render({dir:"out"});
  }
  else if (a === "crumb"){
    const i = +t.dataset.i;
    if (S.lens === "system"){ const from = S.sysPath[i]; S.sysPath = S.sysPath.slice(0, i); S.sysSel = from || null; }
    else { const from = S.path[i]; S.path = S.path.slice(0, i); S.sel = from || null; S.adding = false; }
    S.sheetMode = null; render({dir:"out"});
  }
  else if (a === "sysopen"){ S.sysPath = [...S.sysPath, id]; S.sysSel = null; render({dir:"in"}); }
  else if (a === "take"){ S.sheetMode = S.sheetMode === "take" ? null : "take"; S.dlStatus = ""; S.sel = null; S.adding = false; S.sysSel = null; if (window.innerWidth <= 860) S.tab = "graph"; render(); }
  else if (a === "log"){ S.sheetMode = "log"; S.sysSel = null; render(); }
  else if (a === "closemode"){ S.sheetMode = null; render(); }
  else if (a === "describe"){ S.lens = "ideas"; S.path = ["tool"]; S.sel = null; S.adding = true; S.addPrefill = t.dataset.t; S.sysSel = null; render({dir:"in"}); const i = $("#nn"); if (i) i.focus(); }
  else if (a === "download"){
    if (!DL) return;
    S.dlStatus = "Preparing…"; render();
    try { await DL.save({filename:"stem-splitter-project.md", data:snapshot(buildSystem().T)}); S.dlStatus = "Saved."; }
    catch (err){ S.dlStatus = err && err.code === "declined" ? "Download cancelled." : err && err.code === "rate_limited" ? "A download prompt is already open." : "Downloads aren’t available here."; }
    render();
  }
  else if (a === "open"){ S.path = [...S.path, id]; S.sel = null; render({dir:"in"}); }
  else if (a === "deselect"){ S.sel = null; S.changing = null; render(); }
  else if (a === "sysdeselect"){ S.sysSel = null; render(); }
  else if (a === "add"){ S.adding = true; S.addPrefill = ""; S.sel = null; S.sheetMode = null; render(); const i = $("#nn"); if (i) i.focus(); }
  else if (a === "closeadd"){ S.adding = false; render(); }
  else if (a === "addsave"){
    const name = $("#nn").value.trim(); if (!name){ $("#nn").focus(); return; }
    const nid = "u" + (++S.uc), after = $("#na") ? $("#na").value : "";
    addNode(nid, cur(), name, $("#nd").value.trim() || "Described by you.", "you");
    if (after) S.edges.push([after, nid, ""]);
    S.adding = false; S.addPrefill = ""; S.sel = nid; render();
    await say("Added “" + name + "”. I’ve built a stand-in for it in the finished system, so the tool still works. Open it any time to describe it in more detail, or tell me if you’re not sure how.");
  }
  else if (a === "del"){ const nm = S.nodes[id].title; removeNode(id); S.sel = null; render(); await say("Deleted “" + nm + "”. It’s gone from the system too."); }
  else if (a === "flag"){ await applyFlag(id, +t.dataset.i); }
  else if (a === "keep"){ S.nodes[id].decision.state = "kept"; render(); }
  else if (a === "change"){ S.changing = id; render(); }
  else if (a === "cancelchange"){ S.changing = null; render(); }
  else if (a === "alt"){
    const d = S.nodes[id].decision, alt = d.alts[+t.dataset.i]; S.changing = null;
    if (alt.act === "local"){
      S.chat.push({from:"you", text:alt.label}); renderChat();
      await say("Changing it. Running on the computer takes more parts, so I’ll lay them out as nodes you can see and change.", 900);
      goLocal(); go(["tool", "split"], null, true);
      await say("Rebuilt from your direction. The model now ships with the tool, there’s a library node that runs it, and two steps to keep it fast. One decision is flagged for you: how the model gets onto people’s computers.");
    } else {
      d.state = "mine"; d.text = alt.text; render();
      await say("Changed. The matching code in the System lens now follows your choice.");
    }
  }
  else if (a === "own"){
    const v = ($("#own").value || "").trim(); if (!v){ $("#own").focus(); return; }
    S.changing = null;
    if (id === "s-up"){
      S.chat.push({from:"you", text:v}); renderChat();
      goCustom(v); go(["tool", "split"], "s-custom", true);
      await say("I replaced my plan with your node. Open it and describe the steps, and I’ll say what each one needs and flag anything I’d have to guess.");
    } else {
      const d = S.nodes[id].decision; d.state = "mine"; d.text = v; render();
      await say("Using your way. I’ll check it against the rest of the project and flag anything that clashes.");
    }
  }
  else if (a === "seesys"){ S.lens = "system"; S.sysPath = ["sep"]; S.sysSel = "sp-lib"; render({dir:"in"}); }
  else if (a === "toidea"){ const p = pathTo(id); S.lens = "ideas"; S.path = p; S.sel = id; S.sysSel = null; render({dir:"in"}); }
  else if (a === "build"){ const sc = SCRIPTS.find(s => s.id === "build"); if (window.innerWidth <= 860) { S.tab = "chat"; render(); } runScript(sc); }
  else if (a === "chip"){ const sc = SCRIPTS.find(s => s.id === t.dataset.s); if (sc && sc.avail()) runScript(sc); }
  else if (a === "restart"){
    if (!t.dataset.armed){ t.dataset.armed = "1"; t.textContent = "Tap again"; setTimeout(() => { delete t.dataset.armed; t.textContent = "Restart"; }, 3000); return; }
    delete t.dataset.armed; t.textContent = "Restart"; reset(); render();
  }
});
$("#form").addEventListener("submit", e => {
  e.preventDefault(); const v = $("#inp").value.trim(); if (!v) return; $("#inp").value = ""; handleTyped(v);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if (S.sel || S.adding || S.sysSel || S.sheetMode){ S.sel = null; S.adding = false; S.sysSel = null; S.sheetMode = null; render(); } }
});
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(), 120); });

let DL = null;
reset(); render();
(async () => {
  try { if (window.claude && typeof window.claude.use === "function") DL = await window.claude.use("downloads"); } catch (e) { DL = null; }
  if (S && S.sheetMode === "take") render();
})();
</script>
